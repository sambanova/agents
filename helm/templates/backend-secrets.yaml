{{- $name := .Values.backend.secrets.name }}
{{- $data := .Values.backend.secrets.data | default dict }}
{{- $redis := .Values.redis | default dict }}
{{- $auth := $redis.auth | default dict }}
{{- $authOn := and ($redis.enabled | default false) ($auth.enabled | default false) }}
{{- $pw := $data.REDIS_PASSWORD | default "" }}
{{- if and $authOn (not $pw) }}
  {{/* Reuse the deployed password, or generate one on first install. */}}
  {{- $existing := lookup "v1" "Secret" .Values.global.namespace $name }}
  {{- if and $existing $existing.data }}
    {{- $pw = index $existing.data "REDIS_PASSWORD" | default "" | b64dec }}
  {{- end }}
  {{- if not $pw }}
    {{- $pw = randAlphaNum 32 }}
  {{- end }}
{{- end }}
{{- if $authOn }}
  {{- if ne ($auth.existingSecret | default "") $name }}
    {{- fail (printf "redis.auth.existingSecret (%q) must equal backend.secrets.name (%q)" ($auth.existingSecret | default "") $name) }}
  {{- end }}
  {{- if ne ($auth.existingSecretPasswordKey | default "") "REDIS_PASSWORD" }}
    {{- fail (printf "redis.auth.existingSecretPasswordKey must be REDIS_PASSWORD, got %q" ($auth.existingSecretPasswordKey | default "")) }}
  {{- end }}
  {{- if not $pw }}
    {{- fail "REDIS_PASSWORD is empty: Redis would start without requiring a password" }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.global.namespace }}
type: Opaque
data:
  {{- range $key, $value := $data }}
  {{- if ne $key "REDIS_PASSWORD" }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if or $authOn (hasKey $data "REDIS_PASSWORD") }}
  REDIS_PASSWORD: {{ $pw | b64enc | quote }}
  {{- end }}
