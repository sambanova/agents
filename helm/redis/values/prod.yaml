# Password comes from a pre-existing redis-auth secret in this namespace, which
# must exist before upgrading. Same value as the backend's REDIS_PASSWORD.
auth:
  enabled: true
  existingSecret: redis-auth
  existingSecretPasswordKey: redis-password

image:
  repository: redis/redis-stack-server
  tag: "7.4.0-v5"
  pullPolicy: IfNotPresent

# Ensure Redis Stack modules are loaded
commonConfiguration: |-
  loadmodule /opt/redis-stack/lib/redisearch.so
  loadmodule /opt/redis-stack/lib/rejson.so
  loadmodule /opt/redis-stack/lib/redistimeseries.so
  loadmodule /opt/redis-stack/lib/redisbloom.so

master:
  persistence:
    enabled: true
    size: 10Gi
    storageClass: openebs-hostpath
  
  resources:
    limits:
      cpu: "2000m"
      memory: "4Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"

  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 60
  
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 20

replica:
  replicaCount: 0

service:
  type: ClusterIP
  ports:
    redis: 6379

# Second layer after the password: only the backend's namespace and pod label
# may connect. Selectors must track global.namespace and backend.name.
networkPolicy:
  enabled: true
  allowExternal: false
  ingressNSMatchLabels:
    kubernetes.io/metadata.name: default
  ingressNSPodMatchLabels:
    app: aiskagents-backend
