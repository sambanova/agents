# Require a password. The password is held in a pre-existing secret rather than
# in this file; create it in this Redis release's namespace before upgrading:
#   kubectl create secret generic redis-auth -n redis \
#     --from-literal=redis-password=<password>
# The same value must be set as the backend's REDIS_PASSWORD.
auth:
  enabled: true
  existingSecret: redis-auth
  existingSecretPasswordKey: redis-password

image:
  repository: redis/redis-stack-server
  tag: "7.4.0-v5"
  pullPolicy: IfNotPresent

# Ensure Redis Stack modules are loaded
commonConfiguration: |-
  loadmodule /opt/redis-stack/lib/redisearch.so
  loadmodule /opt/redis-stack/lib/rejson.so
  loadmodule /opt/redis-stack/lib/redistimeseries.so
  loadmodule /opt/redis-stack/lib/redisbloom.so

master:
  persistence:
    enabled: true
    size: 10Gi
    storageClass: openebs-hostpath
  
  resources:
    limits:
      cpu: "2000m"
      memory: "4Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"

  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 60
  
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 20

replica:
  replicaCount: 0

service:
  type: ClusterIP
  ports:
    redis: 6379

# Restrict who can reach Redis at the network layer. This Redis runs in its own
# namespace, so the policy must allow the backend's namespace (global.namespace
# in helm/values.yaml) and pod label (backend.name) explicitly.
# allowExternal:false means only the selectors below, plus Redis's own pods, may
# connect. namespaceSelector and podSelector are ANDed by the chart template.
# NOTE: only enforced if the cluster CNI supports NetworkPolicy, and it does not
# block `kubectl port-forward`. The password remains the primary control.
networkPolicy:
  enabled: true
  allowExternal: false
  ingressNSMatchLabels:
    kubernetes.io/metadata.name: default
  ingressNSPodMatchLabels:
    app: aiskagents-backend
